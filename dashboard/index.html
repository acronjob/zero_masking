<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deletion Tuning runs</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --good: #006300; --critical: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --good: #0ca30c; --critical: #d03b3b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
* { box-sizing: border-box; }
body { margin: 0; }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh;
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 28px 48px; }
h1 { font-size: 18px; font-weight: 600; margin: 0 0 2px; }
.sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }
.sub .stale { color: var(--critical); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .name { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 13px; }
.key { display: inline-block; width: 16px; height: 2px; border-radius: 1px; flex: none; }
.tile .big { font-size: 26px; font-weight: 600; margin: 4px 0 0; }
.tile .big small { font-size: 13px; font-weight: 400; color: var(--text-secondary); }
.tile .meta { color: var(--text-secondary); font-size: 12px; display: grid; grid-template-columns: auto auto; gap: 1px 12px; margin-top: 6px; }
.tile .meta b { color: var(--text-primary); font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.badge { margin-left: auto; font-size: 11px; color: var(--text-muted); }
.badge.run::before { content: "● "; color: var(--good); }
.badge.stalled::before { content: "▲ "; color: var(--critical); }
.badge.done::before { content: "✓ "; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; color: var(--text-secondary); font-size: 13px; margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 10px; position: relative; }
.card h2 { font-size: 14px; font-weight: 600; margin: 0; }
.card .note { color: var(--text-muted); font-size: 12px; margin: 0 0 6px; }
.card svg { display: block; width: 100%; overflow: visible; outline: none; }
.card svg:focus-visible { box-shadow: 0 0 0 2px var(--s1); border-radius: 4px; }
svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); display: none; z-index: 2; white-space: nowrap; }
.tip .hd { color: var(--text-muted); margin-bottom: 4px; }
.tip .row { display: flex; align-items: center; gap: 8px; }
.tip .row b { font-weight: 600; min-width: 52px; font-variant-numeric: tabular-nums; }
.tip .row span:last-child { color: var(--text-secondary); }
details { margin-top: 20px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
summary { cursor: pointer; font-weight: 600; }
table { border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { padding: 4px 14px 4px 0; text-align: right; border-bottom: 1px solid var(--grid); }
th { color: var(--text-secondary); font-weight: 500; }
th:first-child, td:first-child { text-align: left; }
.loading { opacity: 0.55; transition: opacity .2s; }
</style>
</head>
<body>
<div class="viz-root">
  <h1>Deletion Tuning · Qwen3.5-0.8B · GRPO on GSM8K</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="tiles" id="tiles"></div>
  <div class="legend" id="legend"></div>
  <div class="grid" id="charts"></div>
  <details open>
    <summary>Table: test accuracy by eval step</summary>
    <div id="table"></div>
  </details>
</div>
<script>
const REFRESH_MS = 15000, DEFAULT_STEPS = 200, STALE_S = 300;
const SLOTS = 8;
const css = v => getComputedStyle(document.querySelector('.viz-root')).getPropertyValue(v).trim();
const colorOf = i => `var(--s${(i % SLOTS) + 1})`;
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

let RUNS = [], colorIdx = {}, HOVER = null; // HOVER = {chart, step} survives auto-refresh

function rolling(pts, w) {
  return pts.map((p, i) => {
    const s = pts.slice(Math.max(0, i - w + 1), i + 1);
    return [p[0], s.reduce((a, q) => a + q[1], 0) / s.length];
  });
}
function niceTicks(lo, hi, n = 5) {
  const span = hi - lo || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const t = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) t.push(+v.toFixed(10));
  return { ticks: t, lo: Math.floor(lo / step) * step, hi: Math.ceil(hi / step) * step };
}

// ---- line chart with crosshair tooltip + direct end labels ----
function lineChart(card, { id, series, fmt, markers = false, xMax }) {
  const W = card.clientWidth - 32, H = 230, m = { t: 10, r: 96, b: 26, l: 46 };
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, height: H, tabindex: 0, role: 'img' });
  card.appendChild(svg);
  const tip = h('div', 'tip'); card.appendChild(tip);
  const all = series.flatMap(s => s.points);
  if (!all.length) return;
  const ys = all.map(p => p[1]);
  let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi - lo) * 0.08 || Math.abs(hi) * 0.05 || 1;
  const yt = niceTicks(lo - pad, hi + pad);
  const x = v => m.l + (v / xMax) * (W - m.l - m.r);
  const y = v => m.t + (1 - (v - yt.lo) / (yt.hi - yt.lo)) * (H - m.t - m.b);
  for (const t of yt.ticks) {
    el('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: css('--grid'), 'stroke-width': 1 }, svg);
    el('text', { x: m.l - 8, y: y(t) + 4, 'text-anchor': 'end', fill: css('--text-muted') }, svg).textContent = fmt(t);
  }
  el('line', { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: css('--axis') }, svg);
  for (const t of niceTicks(0, xMax, 8).ticks.filter(t => t <= xMax))
    el('text', { x: x(t), y: H - m.b + 16, 'text-anchor': 'middle', fill: css('--text-muted') }, svg).textContent = t;
  el('text', { x: W - m.r, y: H - 2, 'text-anchor': 'end', fill: css('--text-muted') }, svg).textContent = 'step';

  const ends = [];
  for (const s of series) {
    if (!s.points.length) continue;
    const d = s.points.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
    el('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
    if (markers) for (const p of s.points)
      el('circle', { cx: x(p[0]), cy: y(p[1]), r: 4, fill: s.color, stroke: css('--surface-1'), 'stroke-width': 2 }, svg);
    const last = s.points[s.points.length - 1];
    ends.push({ s, last, ty: y(last[1]) });
  }
  // direct labels at line ends, de-collided
  ends.sort((a, b) => a.ty - b.ty);
  for (let i = 1; i < ends.length; i++) ends[i].ty = Math.max(ends[i].ty, ends[i - 1].ty + 14);
  const lx = W - m.r + 8;
  for (const e of ends) {
    el('line', { x1: lx, x2: lx + 10, y1: e.ty, y2: e.ty, stroke: e.s.color, 'stroke-width': 2, 'stroke-linecap': 'round' }, svg);
    el('text', { x: lx + 14, y: e.ty + 4, fill: css('--text-secondary') }, svg).textContent = `${fmt(e.last[1])} ${e.s.short}`;
  }

  // crosshair
  const xs = [...new Set(all.map(p => p[0]))].sort((a, b) => a - b);
  const hair = el('line', { y1: m.t, y2: H - m.b, stroke: css('--text-muted'), 'stroke-width': 1, visibility: 'hidden' }, svg);
  const dots = el('g', {}, svg);
  let cur = -1;
  function show(i) {
    cur = i; const sx = xs[i]; HOVER = { chart: id, step: sx };
    hair.setAttribute('x1', x(sx)); hair.setAttribute('x2', x(sx)); hair.setAttribute('visibility', 'visible');
    dots.replaceChildren(); tip.replaceChildren(h('div', 'hd', `step ${sx}`));
    const rows = series.map(s => ({ s, p: s.points.find(p => p[0] === sx) })).filter(r => r.p).sort((a, b) => b.p[1] - a.p[1]);
    for (const { s, p } of rows) {
      el('circle', { cx: x(sx), cy: y(p[1]), r: 4, fill: s.color, stroke: css('--surface-1'), 'stroke-width': 2 }, dots);
      const row = h('div', 'row'); const k = h('span', 'key'); k.style.background = s.color;
      row.append(k, h('b', null, fmt(p[1])), h('span', null, s.name)); tip.appendChild(row);
    }
    tip.style.display = 'block';
    const r = svg.getBoundingClientRect(), cr = card.getBoundingClientRect();
    const px = (x(sx) / W) * r.width + (r.left - cr.left);
    tip.style.left = (px + 14 + tip.offsetWidth > cr.width ? px - 14 - tip.offsetWidth : px + 14) + 'px';
    tip.style.top = (r.top - cr.top + 8) + 'px';
  }
  function hide() { hair.setAttribute('visibility', 'hidden'); dots.replaceChildren(); tip.style.display = 'none'; cur = -1; HOVER = null; }
  svg.addEventListener('pointermove', ev => {
    const r = svg.getBoundingClientRect(), vx = ((ev.clientX - r.left) / r.width) * W;
    const sv = ((vx - m.l) / (W - m.l - m.r)) * xMax;
    let best = 0; xs.forEach((v, i) => { if (Math.abs(v - sv) < Math.abs(xs[best] - sv)) best = i; });
    show(best);
  });
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowRight') show(Math.min(xs.length - 1, cur + 1));
    else if (ev.key === 'ArrowLeft') show(Math.max(0, cur < 0 ? xs.length - 1 : cur - 1));
    else if (ev.key === 'Escape') hide(); else return;
    ev.preventDefault();
  });
  if (HOVER && HOVER.chart === id) { const i = xs.indexOf(HOVER.step); i >= 0 ? show(i) : (HOVER = null); }
}

function totalSteps(r) { return r.config.steps || DEFAULT_STEPS; }

function render() {
  const now = Date.now() / 1000;
  RUNS.forEach(r => { if (!(r.name in colorIdx)) colorIdx[r.name] = Object.keys(colorIdx).length; });
  const runs = RUNS.map(r => ({ ...r, color: colorOf(colorIdx[r.name]), short: r.name.replace(/^dt_/, '') }));
  const xMax = Math.max(DEFAULT_STEPS, ...runs.map(totalSteps));

  document.getElementById('sub').replaceChildren(
    document.createTextNode(`${runs.length} runs · auto-refresh every ${REFRESH_MS / 1000}s · updated ${new Date().toLocaleTimeString()}`));

  // tiles
  const tiles = document.getElementById('tiles'); tiles.replaceChildren();
  for (const r of runs) {
    const t = h('div', 'tile'), last = r.train[r.train.length - 1] || { step: 0 };
    const ev = r.eval, e0 = ev.find(e => e.step === 0), eL = ev[ev.length - 1], best = ev.reduce((a, e) => (!a || e.eval_acc > a.eval_acc ? e : a), null);
    const recent = r.train.slice(-10), sps = recent.length ? recent.reduce((a, q) => a + q.step_s, 0) / recent.length : null;
    const stalled = !r.finished && now - r.mtime > STALE_S;
    const name = h('div', 'name'); const k = h('span', 'key'); k.style.background = r.color;
    name.append(k, h('span', null, r.name), h('span', 'badge ' + (r.finished ? 'done' : stalled ? 'stalled' : 'run'),
      r.finished ? 'finished' : stalled ? `no update ${Math.round((now - r.mtime) / 60)}m` : 'running'));
    const big = h('div', 'big', eL ? (eL.eval_acc * 100).toFixed(1) + '%' : '–');
    big.appendChild(h('small', null, eL ? `  test acc @ step ${eL.step}` : ''));
    const meta = h('div', 'meta');
    const left = Math.max(0, totalSteps(r) - last.step - 1);
    const kv = [
      ['step', `${r.finished ? totalSteps(r) : last.step + 1} / ${totalSteps(r)}`],
      ['Δ vs step 0', e0 && eL ? `${((eL.eval_acc - e0.eval_acc) * 100 >= 0 ? '+' : '')}${((eL.eval_acc - e0.eval_acc) * 100).toFixed(1)} pts` : '–'],
      ['best', best ? `${(best.eval_acc * 100).toFixed(1)}% @ ${best.step}` : '–'],
      ['s / step', sps ? sps.toFixed(1) : '–'],
      ['ETA', r.finished ? 'done' : sps ? `~${Math.round(left * sps / 60 + 1)} min` : '–'],
    ];
    for (const [a, b] of kv) meta.append(h('span', null, a), h('b', null, b));
    t.append(name, big, meta); tiles.appendChild(t);
  }

  // legend
  const lg = document.getElementById('legend'); lg.replaceChildren();
  for (const r of runs) { const s = h('span'); const k = h('span', 'key'); k.style.background = r.color; s.append(k, document.createTextNode(r.name)); lg.appendChild(s); }

  // charts
  const charts = document.getElementById('charts'); charts.replaceChildren();
  const specs = [
    { title: 'Test accuracy', note: 'Greedy decoding on the GSM8K test set (paper runs: all 1,319; earlier runs: first 500), every 25 steps', markers: true,
      pts: r => r.eval.map(e => [e.step, e.eval_acc * 100]), fmt: v => v.toFixed(1) + '%' },
    { title: 'Training reward', note: 'Fraction of sampled answers correct, 10-step rolling mean',
      pts: r => rolling(r.train.map(e => [e.step, e.reward]), 10), fmt: v => v.toFixed(2) },
    { title: 'gate_proj weights deleted', note: 'Share of gate_proj weights with logit ≤ 0 (hard mask)',
      pts: r => r.train.map(e => [e.step, e.frac_deleted_gate * 100]), fmt: v => v.toFixed(3) + '%' },
    { title: 'Mean response length', note: 'Tokens per sampled answer, 10-step rolling mean',
      pts: r => rolling(r.train.map(e => [e.step, e.mean_len]), 10), fmt: v => Math.round(v).toString() },
  ];
  // append every card first so the grid has settled before charts measure their width
  const cards = specs.map(sp => {
    const card = h('div', 'card'); card.append(h('h2', null, sp.title), h('p', 'note', sp.note)); charts.appendChild(card);
    return card;
  });
  specs.forEach((sp, i) => lineChart(cards[i], { id: i,
    series: runs.map(r => ({ name: r.name, short: r.short, color: r.color, points: sp.pts(r) })),
    fmt: sp.fmt, markers: sp.markers, xMax }));

  // table
  const steps = [...new Set(runs.flatMap(r => r.eval.map(e => e.step)))].sort((a, b) => a - b);
  const tbl = h('table'), hr = h('tr');
  hr.appendChild(h('th', null, 'step')); runs.forEach(r => hr.appendChild(h('th', null, r.name))); hr.appendChild(h('th', null, 'mean ± std'));
  tbl.appendChild(hr);
  for (const s of steps) {
    const tr = h('tr'); tr.appendChild(h('td', null, s)); const vals = [];
    for (const r of runs) { const e = r.eval.find(e => e.step === s); if (e) vals.push(e.eval_acc * 100); tr.appendChild(h('td', null, e ? (e.eval_acc * 100).toFixed(1) : '–')); }
    const mu = vals.reduce((a, v) => a + v, 0) / vals.length;
    const sd = vals.length > 1 ? Math.sqrt(vals.reduce((a, v) => a + (v - mu) ** 2, 0) / (vals.length - 1)) : 0;
    tr.appendChild(h('td', null, vals.length > 1 ? `${mu.toFixed(1)} ± ${sd.toFixed(1)} (n=${vals.length})` : mu.toFixed(1)));
    tbl.appendChild(tr);
  }
  document.getElementById('table').replaceChildren(tbl);
}

async function refresh() {
  const root = document.querySelector('.viz-root');
  root.classList.add('loading');
  try { RUNS = await (await fetch('/api/runs', { cache: 'no-store' })).json(); render(); }
  catch (e) { document.getElementById('sub').textContent = `fetch failed (${e.message}); showing last data`; }
  finally { root.classList.remove('loading'); }
}
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
refresh(); setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
